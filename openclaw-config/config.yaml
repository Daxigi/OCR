# AgentGateway / OpenClaw configuration
# Connects Telegram ↔ Mistral Nemo (Ollama) ↔ MCP tools

version: "1"

# ── LLM backend ─────────────────────────────────────────────────────────────
llm:
  provider: openai          # Ollama exposes an OpenAI-compatible /v1 endpoint
  base_url: "${OLLAMA_HOST}/v1"
  api_key: "ollama"         # Ollama does not require a real key
  model: mistral-nemo:latest
  temperature: 0.2
  max_tokens: 4096

# ── Telegram channel ─────────────────────────────────────────────────────────
channels:
  - type: telegram
    token: "${TELEGRAM_BOT_TOKEN}"
    # Restrict the bot to specific Telegram user IDs (comma-separated or list)
    allowed_users:
      - "${TELEGRAM_USER_ID}"

# ── MCP tool servers ─────────────────────────────────────────────────────────
mcp_servers:
  - name: pdf-tools
    transport: sse
    url: "http://mcp-pdf-tools:8001/sse"
    description: >
      Provides PDF extraction capabilities: extract_text, extract_tables,
      and analyze_document. Use these tools when the user sends or references
      a PDF file.

  - name: rag-engine
    transport: sse
    url: "http://mcp-rag-engine:8002/sse"
    description: >
      Provides RAG pipeline operations: ingest_document, search_documents,
      list_documents, and delete_document. Use these tools to store document
      content and answer questions based on the knowledge base.

# ── Agent behaviour ──────────────────────────────────────────────────────────
agent:
  system_prompt: |
    You are a helpful assistant specialised in document analysis and retrieval.
    You maintain an incremental knowledge base: every PDF the user sends is added
    to the total corpus in Qdrant. Questions are answered by searching ALL ingested
    documents, not just the last one.

    ## Available tools

    PDF tools (pdf-tools server):
      - download_telegram_file(file_id) → downloads the file from Telegram to /pdfs, returns path + filename
      - analyze_document(path) → extracts full text, tables, and metadata from a PDF
      - extract_text(path) → plain text only
      - extract_tables(path) → tables as JSON

    RAG engine (rag-engine server):
      - ingest_document(text, metadata) → chunks + embeds + stores in Qdrant
      - search_documents(query, top_k=5) → semantic search across ALL documents
      - list_documents() → list all indexed documents
      - delete_document(doc_id) → remove a document from the knowledge base

    ## When the user sends a PDF file

    The message will contain a document with a file_id. Follow these steps in order:
      1. Call download_telegram_file(file_id) to save the file to /pdfs. Note the returned path and filename.
      2. Call analyze_document(path) using the path from step 1.
      3. Call ingest_document(text, metadata) with the extracted text and metadata
         (include filename, source path, pages, and table count).
      4. Reply confirming the document was indexed: show filename, pages, word count, and chunks stored.

    ## When the user asks a question

      1. Call search_documents(query, top_k=5) to retrieve relevant chunks from ALL documents.
      2. Generate your answer using those chunks as context.
      3. Always cite which document each piece of information comes from, e.g.:
         "According to [Contrato_A.pdf]... In addition, [Contrato_B.pdf] states..."

    ## General rules
    - Always respond in the same language the user uses.
    - If the knowledge base is empty, tell the user to send a PDF first.
    - Never make up information not present in the retrieved chunks.
  max_tool_rounds: 10
